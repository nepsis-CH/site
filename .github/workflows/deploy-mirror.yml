# Publică o copie a site-ului pe GitHub Pages „de proiect”, adică într-un
# subdirector: https://<utilizator>.github.io/<nume-repo>/
#
# Deploy-ul principal (ch.nepsis.org) rămâne cel din `deploy.yml`, care rulează
# la push pe `master`. Acest fișier rulează doar pe `main`, deci cele două nu se
# calcă în picioare.
name: Deploy mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # ATENȚIE: fără „schedule” aici. Un declanșator programat ignoră filtrul
  # `branches` și rulează întotdeauna pe ramura implicită a depozitului. Pe
  # depozitul de producție aceea e `master`, deci un cron pus aici ar construi
  # site-ul real cu BASE_PATH-ul oglinzii și i-ar șterge CNAME-ul.
  # Reconstruirea zilnică stă doar în deploy.yml.

permissions:
  contents: read
  pages: write
  id-token: write

# Un singur deploy odată; nu anulăm unul pornit, ca să nu rămână Pages la jumătate.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site for the project subdirectory
        env:
          # Derivate din repo, ca să meargă la fel și pentru un fork.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Drop the production custom domain
        # public/CNAME conține ch.nepsis.org. Fără acest pas, GitHub Pages ar
        # încerca să revendice domeniul site-ului real de pe acest repo.
        run: rm -f dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
