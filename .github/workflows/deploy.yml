# Publică automat site-ul pe GitHub Pages la fiecare commit pe master.
# Nu este nevoie să modifici acest fișier.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Site-ul e static: „următorul eveniment” se hotărăște la construire, după
  # ceasul de atunci. Fără reconstruire, pagina ar rămâne să arate un eveniment
  # care a trecut. Reconstruim în fiecare noapte, ca ziua să înceapă corect.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install, build, and upload site
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
